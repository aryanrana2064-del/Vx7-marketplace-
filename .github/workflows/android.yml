name: Build VX7 Marketing APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs Gradle 8.9 (required by AGP 8.7.x) and caches dependencies.
      # No Gradle wrapper is committed, so this provides the `gradle` command.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Name the APK
        run: |
          mkdir -p artifacts
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "Built: $APK"
          cp "$APK" artifacts/VX7-Marketing.apk
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: VX7-Marketing.apk
          path: artifacts/VX7-Marketing.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
